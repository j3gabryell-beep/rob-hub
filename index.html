<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROB HUB</title>
<meta name="description" content="Busca offline de alarmes de robôs industriais">
<meta name="theme-color" content="#0f1b2d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ROB HUB">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button id="back" class="icon-btn" hidden aria-label="Voltar">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="brand"><span class="logo">RH</span><span id="title">ROB HUB</span></div>
  <button id="lang" class="lang">EN</button>
</header>

<main id="view-search">
  <div class="seg" id="mode" role="tablist">
    <button data-mode="code" data-i18n="mCode">Código</button>
    <button data-mode="kw" data-i18n="mKw">Palavras-chave</button>
  </div>
  <div class="searchbox">
    <svg class="search-ico" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.6-3.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="q" type="search" inputmode="search" autocomplete="off" autocorrect="off" spellcheck="false">
    <button id="clear" class="clear" hidden aria-label="Limpar">
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
  </div>
  <p id="count" class="count"></p>
  <ul id="list" class="list"></ul>
  <footer class="foot" id="foot"></footer>
</main>

<main id="view-detail" hidden></main>

<nav class="bottom-nav">
  <button class="tab active" data-tab="results">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M20 20l-3.6-3.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span data-i18n="tabResults">Buscar</span>
  </button>
  <button class="tab" data-tab="favs">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    <span data-i18n="tabFavs">Favoritos</span>
  </button>
  <button class="tab" data-tab="recent">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span data-i18n="tabRecent">Recentes</span>
  </button>
</nav>
<script src="app.js"></script>
</body>
</html>
